<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Park Computadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-orange: #f05a00;
            --primary-blue: #1a2c3e;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #2c3e50 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h2 {
            color: var(--primary-blue);
            font-weight: bold;
        }
        
        .logo h2 span {
            color: var(--primary-orange);
        }
        
        .btn-login {
            background-color: var(--primary-orange);
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .btn-login:hover {
            background-color: #d44e00;
            transform: scale(1.02);
        }
        
        .alert {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-desktop fa-3x" style="color: #f05a00;"></i>
            <h2>PARK<span>Manager</span></h2>
            <p class="text-muted">Sistema de Gerenciamento de Computadores</p>
        </div>
        
        <div id="alertErro" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i> Usuário ou senha inválidos!
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-user me-1"></i> Usuário
                </label>
                <input type="text" class="form-control" id="username" required autofocus>
            </div>
            
            <div class="mb-3">
                <label class="form-label">
                    <i class="fas fa-lock me-1"></i> Senha
                </label>
                <input type="password" class="form-control" id="password" required>
            </div>
            
            <button type="submit" class="btn btn-login text-white">
                <i class="fas fa-sign-in-alt me-2"></i> Entrar
            </button>
        </form>
        
        <div class="text-center mt-4">
            <small class="text-muted">© 2026 - Sistema de Parque de Computadores</small>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertErro = document.getElementById('alertErro');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    alertErro.style.display = 'block';
                    setTimeout(() => {
                        alertErro.style.display = 'none';
                    }, 3000);
                }
            } catch (error) {
                alertErro.style.display = 'block';
            }
        });
    </script>
</body>
</html>
